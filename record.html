<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>記一筆 - MoneyBook</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="./css/style.css" rel="stylesheet">
</head>
<body>
  <header id="navbar"></header>

  <main class="container py-4" style="max-width: 640px;">
    <h1 class="h3 mb-3" id="pageTitle">記一筆</h1>

    <div id="alertArea"></div>

    <!-- 讀取資料時顯示 spinner -->
    <div id="loading" class="d-flex justify-content-center py-5">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">載入中...</span>
      </div>
    </div>

    <form id="recordForm" class="d-none" novalidate>
      <div class="mb-3">
        <div class="form-label" id="typeLabel">類型</div>
        <div class="btn-group w-100" role="group" aria-labelledby="typeLabel">
          <input type="radio" class="btn-check" name="type" id="typeExpense" value="Expense" autocomplete="off" checked>
          <label class="btn btn-outline-danger" for="typeExpense">支出</label>
          <input type="radio" class="btn-check" name="type" id="typeIncome" value="Income" autocomplete="off">
          <label class="btn btn-outline-success" for="typeIncome">收入</label>
        </div>
      </div>

      <div class="mb-3">
        <label for="dateInput" class="form-label">日期</label>
        <input type="date" class="form-control" id="dateInput">
        <div class="invalid-feedback" id="dateError"></div>
      </div>

      <div class="mb-3">
        <label for="amountInput" class="form-label">金額（新台幣）</label>
        <div class="input-group has-validation">
          <span class="input-group-text">NT$</span>
          <input type="number" class="form-control" id="amountInput" min="1" step="1" inputmode="numeric" placeholder="0">
          <div class="invalid-feedback" id="amountError"></div>
        </div>
      </div>

      <div class="mb-3">
        <label for="categorySelect" class="form-label">分類</label>
        <select class="form-select" id="categorySelect"></select>
        <div class="invalid-feedback" id="categoryError"></div>
      </div>

      <div class="mb-3">
        <label for="paymentSelect" class="form-label">付款方式（選填）</label>
        <select class="form-select" id="paymentSelect"></select>
      </div>

      <div class="mb-3">
        <label for="noteInput" class="form-label">備註（選填）</label>
        <textarea class="form-control" id="noteInput" rows="3"></textarea>
      </div>

      <div class="d-flex flex-wrap gap-2">
        <button type="submit" class="btn btn-primary" id="submitBtn" data-busy-lock>新增</button>
        <button type="button" class="btn btn-outline-danger d-none" id="deleteBtn" data-busy-lock>刪除</button>
      </div>
    </form>
  </main>

  <!-- 刪除確認視窗 -->
  <div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title fs-5" id="deleteModalLabel">刪除紀錄</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="關閉"></button>
        </div>
        <div class="modal-body">
          確定要刪除這筆紀錄嗎？刪除後無法復原。
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
          <button type="button" class="btn btn-danger" id="confirmDeleteBtn" data-busy-lock>確定刪除</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="./js/record.js"></script>
</body>
</html>
