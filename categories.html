<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>分類管理 - MoneyBook</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="./css/style.css" rel="stylesheet">
</head>
<body>
  <header id="navbar"></header>

  <main class="container py-4" style="max-width: 720px;">
    <h1 class="h3 mb-3">分類管理</h1>

    <div id="alertArea"></div>

    <!-- 讀取資料時顯示 spinner -->
    <div id="loading" class="d-flex justify-content-center py-5">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">載入中...</span>
      </div>
    </div>

    <div id="content" class="d-none">
      <form id="addForm" class="card card-body mb-4" novalidate>
        <h2 class="h6 mb-3">新增分類</h2>
        <div class="row g-2">
          <div class="col-12 col-sm-6">
            <label for="addName" class="visually-hidden">分類名稱</label>
            <input type="text" class="form-control" id="addName" placeholder="分類名稱" maxlength="30" autocomplete="off">
            <div class="invalid-feedback" id="addNameError"></div>
          </div>
          <div class="col-6 col-sm-3">
            <label for="addType" class="visually-hidden">類型</label>
            <select class="form-select" id="addType">
              <option value="Expense">支出</option>
              <option value="Income">收入</option>
            </select>
          </div>
          <div class="col-6 col-sm-3 d-grid">
            <button type="submit" class="btn btn-primary" data-busy-lock>新增</button>
          </div>
        </div>
      </form>

      <p class="text-secondary small">停用的分類不會出現在「記一筆」的下拉選單，舊紀錄仍會顯示其名稱。</p>

      <h2 class="h5 mt-4">收入</h2>
      <ul class="list-group mb-4" id="incomeList"></ul>

      <h2 class="h5">支出</h2>
      <ul class="list-group mb-4" id="expenseList"></ul>
    </div>
  </main>

  <!-- 改名視窗 -->
  <div class="modal fade" id="renameModal" tabindex="-1" aria-labelledby="renameModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <form class="modal-content" id="renameForm" novalidate>
        <div class="modal-header">
          <h2 class="modal-title fs-5" id="renameModalLabel">修改分類名稱</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="關閉"></button>
        </div>
        <div class="modal-body">
          <label for="renameInput" class="form-label">分類名稱</label>
          <input type="text" class="form-control" id="renameInput" maxlength="30" autocomplete="off">
          <div class="invalid-feedback" id="renameError"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
          <button type="submit" class="btn btn-primary" id="renameSubmit" data-busy-lock>儲存</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="./js/categories.js"></script>
</body>
</html>
