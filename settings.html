<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>設定 - MoneyBook</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="./css/style.css" rel="stylesheet">
</head>
<body>
  <header id="navbar"></header>

  <main class="container py-4" style="max-width: 640px;">
    <h1 class="h3 mb-3">設定</h1>

    <div id="setupAlert" class="alert alert-warning d-none" role="alert">
      尚未完成設定，請輸入 Token 與 Base ID 後儲存。
    </div>

    <form id="settingsForm" novalidate>
      <div class="mb-3">
        <label for="tokenInput" class="form-label">Token</label>
        <input type="password" class="form-control" id="tokenInput" autocomplete="off" aria-describedby="tokenHelp">
        <div class="invalid-feedback" id="tokenError"></div>
        <div class="form-text" id="tokenHelp">Airtable 個人存取權杖，權限只需開啟 data.records:read 與 data.records:write。</div>
      </div>

      <div class="mb-3">
        <label for="baseIdInput" class="form-label">Base ID</label>
        <input type="text" class="form-control" id="baseIdInput" autocomplete="off" placeholder="app..." aria-describedby="baseIdHelp">
        <div class="invalid-feedback" id="baseIdError"></div>
        <div class="form-text" id="baseIdHelp">Airtable Base 的識別碼，以 app 開頭。</div>
      </div>

      <div class="d-flex flex-wrap gap-2">
        <button type="submit" class="btn btn-primary">儲存設定</button>
        <button type="button" class="btn btn-outline-danger" id="clearBtn">清除設定</button>
      </div>
    </form>
  </main>

  <!-- 清除設定的確認視窗 -->
  <div class="modal fade" id="clearModal" tabindex="-1" aria-labelledby="clearModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title fs-5" id="clearModalLabel">清除設定</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="關閉"></button>
        </div>
        <div class="modal-body">
          確定要清除已儲存的 Token 與 Base ID 嗎？清除後需要重新輸入才能使用。
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
          <button type="button" class="btn btn-danger" id="confirmClearBtn">確定清除</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="./js/settings.js"></script>
</body>
</html>
