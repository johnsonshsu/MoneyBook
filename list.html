<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>月明細 - MoneyBook</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="./css/style.css" rel="stylesheet">
</head>
<body>
  <header id="navbar"></header>

  <main class="container py-4" style="max-width: 720px;">
    <h1 class="h3 mb-3">月明細</h1>

    <div id="alertArea"></div>

    <!-- 月份切換 -->
    <div class="input-group mb-3">
      <button type="button" class="btn btn-outline-secondary" id="prevMonth" aria-label="上一個月">&lsaquo;</button>
      <input type="month" class="form-control text-center" id="monthInput" aria-label="選擇月份">
      <button type="button" class="btn btn-outline-secondary" id="nextMonth" aria-label="下一個月">&rsaquo;</button>
    </div>

    <!-- 該月小計 -->
    <div class="row g-2 mb-3 text-center">
      <div class="col-4">
        <div class="card h-100">
          <div class="card-body px-2 py-3">
            <div class="small text-secondary">收入</div>
            <div class="fw-bold text-success text-break" id="sumIncome">-</div>
          </div>
        </div>
      </div>
      <div class="col-4">
        <div class="card h-100">
          <div class="card-body px-2 py-3">
            <div class="small text-secondary">支出</div>
            <div class="fw-bold text-danger text-break" id="sumExpense">-</div>
          </div>
        </div>
      </div>
      <div class="col-4">
        <div class="card h-100">
          <div class="card-body px-2 py-3">
            <div class="small text-secondary">結餘</div>
            <div class="fw-bold text-break" id="sumBalance">-</div>
          </div>
        </div>
      </div>
    </div>

    <!-- 篩選 -->
    <div class="row g-2 mb-3">
      <div class="col-6">
        <label for="typeFilter" class="visually-hidden">類型</label>
        <select class="form-select" id="typeFilter">
          <option value="">全部類型</option>
          <option value="Income">收入</option>
          <option value="Expense">支出</option>
        </select>
      </div>
      <div class="col-6">
        <label for="categoryFilter" class="visually-hidden">分類</label>
        <select class="form-select" id="categoryFilter"></select>
      </div>
    </div>

    <!-- 讀取資料時顯示 spinner -->
    <div id="loading" class="d-flex justify-content-center py-5">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">載入中...</span>
      </div>
    </div>

    <div id="recordList" class="list-group"></div>
    <p id="emptyMessage" class="text-center text-secondary py-4 d-none"></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="./js/list.js"></script>
</body>
</html>
