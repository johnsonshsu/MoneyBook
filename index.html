<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>首頁 - MoneyBook</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="./css/style.css" rel="stylesheet">
</head>
<body>
  <header id="navbar"></header>

  <main class="container py-4" style="max-width: 720px;">
    <h1 class="h3 mb-3">首頁</h1>

    <div id="alertArea"></div>

    <!-- 讀取資料時顯示 spinner -->
    <div id="loading" class="d-flex justify-content-center py-5">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">載入中...</span>
      </div>
    </div>

    <div id="content" class="d-none">
      <h2 class="h6 text-secondary" id="monthLabel"></h2>

      <!-- 本月收入、支出、結餘 -->
      <div class="row g-2 mb-4 text-center">
        <div class="col-4">
          <div class="card h-100">
            <div class="card-body px-2 py-3">
              <div class="small text-secondary">收入</div>
              <div class="fw-bold text-success text-break" id="sumIncome">-</div>
            </div>
          </div>
        </div>
        <div class="col-4">
          <div class="card h-100">
            <div class="card-body px-2 py-3">
              <div class="small text-secondary">支出</div>
              <div class="fw-bold text-danger text-break" id="sumExpense">-</div>
            </div>
          </div>
        </div>
        <div class="col-4">
          <div class="card h-100">
            <div class="card-body px-2 py-3">
              <div class="small text-secondary">結餘</div>
              <div class="fw-bold text-break" id="sumBalance">-</div>
            </div>
          </div>
        </div>
      </div>

      <!-- 最近 10 筆紀錄 -->
      <h2 class="h5">最近 10 筆紀錄</h2>
      <div id="recentList" class="list-group mb-3"></div>
      <p id="emptyMessage" class="text-center text-secondary py-4 d-none">尚無紀錄</p>

      <div class="d-grid">
        <a class="btn btn-outline-primary" id="monthLink" href="./list.html">查看本月明細</a>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="./js/index.js"></script>
</body>
</html>
