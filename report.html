<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>統計 - MoneyBook</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="./css/style.css" rel="stylesheet">
</head>
<body>
  <header id="navbar"></header>

  <main class="container py-4" style="max-width: 720px;">
    <h1 class="h3 mb-3">統計</h1>

    <div id="alertArea"></div>

    <!-- 月份切換 -->
    <div class="input-group mb-3">
      <button type="button" class="btn btn-outline-secondary" id="prevMonth" aria-label="上一個月">&lsaquo;</button>
      <input type="month" class="form-control text-center" id="monthInput" aria-label="選擇月份">
      <button type="button" class="btn btn-outline-secondary" id="nextMonth" aria-label="下一個月">&rsaquo;</button>
    </div>

    <!-- 讀取資料時顯示 spinner -->
    <div id="loading" class="d-flex justify-content-center py-5">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">載入中...</span>
      </div>
    </div>

    <div id="content" class="d-none">
      <!-- 當月支出分類 -->
      <section class="card mb-4" aria-labelledby="expenseTitle">
        <div class="card-body">
          <h2 class="h5 card-title" id="expenseTitle">支出分類</h2>
          <p class="text-center text-secondary py-4 mb-0 d-none" id="expenseEmpty">本月尚無紀錄</p>
          <div id="expenseBody">
            <div class="position-relative mx-auto mb-3 chart-box">
              <canvas id="expenseChart" role="img" aria-label="當月支出分類圓餅圖"></canvas>
            </div>
            <div class="table-responsive">
              <table class="table table-sm align-middle mb-0">
                <thead>
                  <tr><th scope="col">分類</th><th scope="col" class="text-end">金額</th><th scope="col" class="text-end">占比</th></tr>
                </thead>
                <tbody id="expenseRows"></tbody>
              </table>
            </div>
          </div>
        </div>
      </section>

      <!-- 當月收入分類 -->
      <section class="card mb-4" aria-labelledby="incomeTitle">
        <div class="card-body">
          <h2 class="h5 card-title" id="incomeTitle">收入分類</h2>
          <p class="text-center text-secondary py-4 mb-0 d-none" id="incomeEmpty">本月尚無紀錄</p>
          <div id="incomeBody">
            <div class="position-relative mx-auto mb-3 chart-box">
              <canvas id="incomeChart" role="img" aria-label="當月收入分類圓餅圖"></canvas>
            </div>
            <div class="table-responsive">
              <table class="table table-sm align-middle mb-0">
                <thead>
                  <tr><th scope="col">分類</th><th scope="col" class="text-end">金額</th><th scope="col" class="text-end">占比</th></tr>
                </thead>
                <tbody id="incomeRows"></tbody>
              </table>
            </div>
          </div>
        </div>
      </section>

      <!-- 近 6 個月收支 -->
      <section class="card mb-4" aria-labelledby="trendTitle">
        <div class="card-body">
          <h2 class="h5 card-title" id="trendTitle">近 6 個月收支</h2>
          <p class="text-center text-secondary py-4 mb-0 d-none" id="trendEmpty">近 6 個月尚無紀錄</p>
          <div class="position-relative chart-box-wide" id="trendBody">
            <canvas id="trendChart" role="img" aria-label="近 6 個月收入與支出長條圖"></canvas>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script type="module" src="./js/report.js"></script>
</body>
</html>
